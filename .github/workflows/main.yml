name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Type Check
        run: npx tsc --noEmit
      - name: Run Tests
        run: npm test -- --passWithNoTests --exclude tests/security/storage_leak.test.ts --exclude tests/security/rls_isolation.test.ts --exclude tests/unit/cvAnalyzer.test.ts --exclude tests/JobApplication.test.tsx --exclude tests/security/ai_bypass.test.ts
