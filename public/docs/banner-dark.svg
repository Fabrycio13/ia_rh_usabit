<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d16" />
      <stop offset="100%" stop-color="#121628" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Favicon "u" Gradient -->
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Wordmark "people" Gradient -->
    <linearGradient id="peopleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGrad)" />
  <rect width="1280" height="320" fill="url(#grid)" />

  <!-- Glows -->
  <circle cx="380" cy="160" r="320" fill="url(#glowBlue)" />
  <circle cx="900" cy="160" r="320" fill="url(#glowPurple)" />

  <!-- Enterprise Badge -->
  <g transform="translate(640, 75)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
    <text y="4" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" letter-spacing="0.15em">PLATAFORMA ENTERPRISE</text>
  </g>

  <!-- Centered Brand Group -->
  <!-- Total Width: 364px (56px Icon + 20px Gap + 288px Wordmark). Group X: 640 - (364 / 2) = 458. Group Y: 132 -->
  <g transform="translate(458, 132)">
    
    <!-- Símbolo / Ícone (Favicon Estilizado do Projeto) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#0d1b2a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
      <text x="28" y="44" text-anchor="middle" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-weight="800" font-size="49" fill="url(#uGrad)">u</text>
    </g>

    <!-- Logotipo Oficial Usabit People (Escalado 1.2x. Y offset para centralizar verticalmente: (56 - 48) / 2 = 4) -->
    <g transform="translate(76, 4) scale(1.2)">
      <!-- usabit wordmark (Official paths, fill off-white) -->
      <g transform="translate(0, 4)">
        <!-- i dot -->
