        <!-- s -->
        <path d="M28.5265 15.8757C28.5265 14.804 29.545 14.0901 31.0749 14.0901C32.9608 14.0901 35.409 14.9058 37.042 16.0284L37.9094 11.6908C36.1238 10.516 33.1671 9.70022 30.8221 9.70022C26.1306 9.70022 23.1231 12.0471 23.1231 15.8234C23.1231 20.2116 26.6992 21.3865 29.6676 22.3618C31.7737 23.0537 33.5739 23.6452 33.5739 25.2124C33.5739 26.54 32.2997 27.3049 30.5155 27.3049C28.7822 27.3049 26.6406 26.4368 24.9073 25.2633L22.154 29.0905C24.7024 30.8252 27.8131 31.7951 30.8715 31.7951C35.9189 31.7951 39.233 29.1414 39.233 25.1107C39.233 20.7557 35.4718 19.5378 32.4079 18.5456C30.3025 17.8639 28.5265 17.2888 28.5265 15.8757Z" fill="#F5F6F8"/>
        <!-- u -->
        <path d="M9.58487 27.255C6.52647 27.255 5.6591 25.3676 5.6591 21.5404V10.1636H0V21.0315C0 28.2263 2.09073 31.8485 8.00411 31.8485C11.4708 31.8485 13.4075 29.7051 14.3257 28.174V31.4908H19.8831V10.1621H14.3257V20.5706C14.3257 24.5504 12.6433 27.255 9.58487 27.255Z" fill="#F5F6F8"/>
        <!-- a -->
        <path fill-rule="evenodd" clip-rule="evenodd" d="M52.192 9.70022C57.9927 9.70022 61.3698 12.4515 62.3233 13.2282C62.3668 13.2637 62.406 13.2956 62.4394 13.3224V31.3851H56.9329V27.6597C56.0655 29.2418 54.1796 31.6905 50.5604 31.6905C44.493 31.6905 41.0772 27.2003 41.0772 20.9244C41.0772 14.599 45.0552 9.70022 52.192 9.70022ZM51.6312 26.9981C54.8944 26.9981 56.9329 24.039 56.9329 18.7825V15.4657C56.372 15.108 54.9438 14.2922 52.4463 14.2922C48.6222 14.2922 46.7363 17.3531 46.7363 20.9767C46.7377 24.3444 48.1645 26.9981 51.6312 26.9981Z" fill="#F5F6F8"/>
        <!-- t -->
        <path d="M102.213 23.62C102.213 29.4378 104.103 31.7777 109.605 31.9883C111.022 32.0421 112.011 31.9007 113 31.7593V27.3765C111.521 27.5306 110.676 27.5999 109.555 27.3454C108.179 27.04 107.821 26.0193 107.821 23.7233V14.7937H112.97V10.4052H107.821L107.821 6.94708C107.821 6.94708 105.513 4.685 102.213 3.69534V10.4052L98.3384 10.4109L98.338 14.7923H102.213V23.62Z" fill="#F5F6F8"/>
      </g>
      <!-- people wordmark (Official Inter/Montserrat style text + Gradient) -->
      <text x="123" y="34.8" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.03em" fill="url(#peopleGrad)">people</text>
    </g>
  </g>

  <!-- Tagline -->
  <text x="640" y="240" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.04em">
    Recrutamento e Seleção com Inteligência Artificial
  </text>
</svg>
