<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background: light gradient (off-white to soft blue) -->
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <!-- Reuse logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <!-- Subtle accent glow -->
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgLight)" />
  <!-- Accent glow centered behind logo -->
  <circle cx="640" cy="160" r="280" fill="url(#glowLight)" />

  <!-- Group: centered logo + tagline -->
  <g transform="translate(540, 110)">
    <!-- Icon: stylized abstract U + people -->
    <g transform="translate(0, 0)">
      <!-- Logo mark: a U-shape with a person silhouette -->
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#3b82f6" />
      <path d="M14 14 L14 24 Q14 32 22 32 L26 32 Q34 32 34 24 L34 14"
            stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="20" cy="42" r="2.5" fill="#ffffff" />
      <circle cx="28" cy="42" r="2.5" fill="#ffffff" />
      <!-- Sparkle (AI accent) -->
      <path d="M40 8 L41.5 11 L44.5 12.5 L41.5 14 L40 17 L38.5 14 L35.5 12.5 L38.5 11 Z"
            fill="#14b8a6" />
    </g>

    <!-- Wordmark: simple bold typography (cannot embed SVG path easily, so use text) -->
    <g transform="translate(64, 0)">
      <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif"
            font-size="28" font-weight="700" fill="#0f172a"
            letter-spacing="-0.02em">usabit</text>
      <text x="92" y="22" font-family="system-ui, -apple-system, sans-serif"
            font-size="28" font-weight="400" fill="url(#logoGrad)"
            letter-spacing="-0.02em">people</text>

      <!-- Tagline -->
      <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif"
            font-size="15" font-weight="500" fill="#475569"
            letter-spacing="0">Recrutamento e Seleção com IA</text>
    </g>
  </g>
</svg>
