<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#14b8a6" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  {/* Aumentando o texto central para preencher melhor o espaço */}
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="900" fill="white" style="filter: drop-shadow(0 0 3px rgba(59, 130, 246, 0.6))">IA</text>
  
  {/* Ajustando os círculos orbitais para ficarem mais próximos dos cantos e levemente maiores */}
  <circle cx="28" cy="6" r="4.5" fill="#14b8a6" style="filter: url(#fGlow)" />
  <circle cx="4" cy="26" r="4.5" fill="#3b82f6" style="filter: url(#fGlow)" />
  <circle cx="26" cy="27" r="4" fill="#8b5cf6" style="filter: url(#fGlow)" />
</svg>
